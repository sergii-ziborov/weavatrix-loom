name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: cargo check + test (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Test workspace (excludes long golden matrix — see gates job)
        run: cargo test --workspace --lib --bins --tests -- --nocapture --skip golden

  gates:
    name: Gates A/D (conformance + golden)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Gate A — capability vectors (CLI)
        run: cargo run -p wvx-cli --quiet -- conformance

      - name: Gate A + D — wvx-conformance suite (includes golden export)
        run: cargo test -p wvx-conformance -- --nocapture

      - name: Pilot run with third parse backend
        run: |
          cargo run -p wvx-cli --quiet -- run fixtures/pilot-json-pipeline.wvx.json \
            --impl parse=json-crate.parse@1

      - name: Cortex intent heuristics (no API key)
        run: |
          cargo test -p wvx-cortex -- --nocapture
          cargo run -p wvx-cli --quiet -- patch intent "install the pilot json pipeline"
          cargo run -p wvx-cli --quiet -- patch intent "use pretty serialize" \
            --project fixtures/pilot-json-pipeline.wvx.json

      - name: Registry admission audit (overclaim check)
        run: cargo run -p wvx-cli --quiet -- registry check

  docs-and-schemas:
    name: Schemas present
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Required schema files exist
        run: |
          test -f schemas/wvx.project.v0.1.json
          test -f schemas/wvx.capability.v0.1.json
          test -f schemas/wvx.implementation.v0.1.json
          test -f schemas/wvx.graph_patch.v0.1.json
          test -f docs/adr/README.md
          test -f docs/go-no-go-a-d-pilot-json.md
          test -f fixtures/pilot-json-pipeline.wvx.json
