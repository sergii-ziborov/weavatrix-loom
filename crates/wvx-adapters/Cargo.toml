[package]
name = "wvx-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Pilot adapters for Weavatrix Loom (JSON, text, hash, compress, codec, …)"
publish = true
keywords = ["weavatrix", "loom", "wvx"]
categories = ["development-tools"]
readme = "README.md"

[features]
default = ["host"]
# Host registration into wvx-component-sdk (playground). Disable for bare export vendor.
host = ["dep:wvx-component-sdk"]

[dependencies]
serde_json = { workspace = true }
# Third independent parse path for Gate A (not serde-based).
json = "0.12"
# Domain 2 — hashing (bytes → digest); multi-impl + second algorithm.
sha2 = "0.10"
# pure = no C/asm (Windows GNU link issues in FORGE-008 temp crates)
blake3 = { version = "1.5", default-features = false, features = ["std", "pure"] }
# Domain 3 — compression (gzip).
flate2 = { version = "1", default-features = true }
# Domain 4 — binary codecs (base64 multi-impl; hex is pure).
base64 = "0.22"
wvx-component-sdk = { workspace = true, optional = true }

[lints]
workspace = true
