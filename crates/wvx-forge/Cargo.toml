[package]
name = "wvx-forge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Thin Loom Forge: semantic match/draft + bootstrap inventory (not a code indexer)"
publish = true
keywords = ["weavatrix", "loom", "wvx"]
categories = ["development-tools"]
readme = "README.md"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = "0.8"
sha2 = "0.10"
# FORGE-004: structured Rust AST extraction (static, no code execution).
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }

[lints]
workspace = true
