name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test (lib)
        run: cargo test --workspace --lib --exclude wvx-conformance
      - name: conformance + profile runner
        run: cargo test -p wvx-conformance --lib
      - name: schema contracts
        run: cargo test -p wvx-schema-contract
      - name: verified release e2e (mandatory gate)
        run: cargo test -p wvx-command-bus --test verified_release_e2e -- --nocapture
      - name: truthful registry
        run: cargo test -p wvx-registry-client --lib

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.78.0
      - name: MSRV cargo check
        run: cargo check --workspace --all-targets
