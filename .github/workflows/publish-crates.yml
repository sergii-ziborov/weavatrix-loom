# Publish library crates to crates.io (hosts stay private).
# Secret: CARGO_REGISTRY_TOKEN (repo Settings → Secrets → Actions)
#
# Manual: Actions → Publish crates.io → Run workflow
# Optional: push tag v0.1.0 (or any v*)
name: Publish crates.io

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run only (cargo publish --dry-run)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

jobs:
  publish:
    name: cargo publish (library crates)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify registry token is set
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is missing"
            exit 1
          fi
          echo "CARGO_REGISTRY_TOKEN is set (value not printed)"

      - name: Publish crates bottom-up
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          set -euo pipefail
          # Dependency order (see docs/crate-surface.md)
          CRATES=(
            wvx-types
            wvx-ir
            wvx-validator
            wvx-registry-client
            wvx-project-graph
            wvx-runtime
            wvx-compiler-rust
            wvx-forge
            wvx-component-sdk
            wvx-adapters
            wvx-conformance
            wvx-cortex
            wvx-command-bus
          )
          EXTRA=()
          if [ "${DRY_RUN}" = "1" ]; then
            EXTRA+=(--dry-run)
            echo "DRY RUN mode"
          fi
          for crate in "${CRATES[@]}"; do
            echo "::group::publish ${crate}"
            set +e
            out=$(cargo publish -p "${crate}" "${EXTRA[@]}" 2>&1)
            code=$?
            set -e
            # Never echo secrets; cargo rarely prints token, but strip just in case
            echo "$out" | sed -E 's/cio_[A-Za-z0-9_-]+/[REDACTED]/g; s/CARGO_REGISTRY_TOKEN=[^ ]+/CARGO_REGISTRY_TOKEN=[REDACTED]/g'
            if [ $code -eq 0 ]; then
              echo "OK ${crate}"
              if [ "${DRY_RUN}" != "1" ]; then
                echo "Waiting for crates.io index..."
                sleep 15
              fi
            elif echo "$out" | grep -qiE 'already exists|already uploaded'; then
              echo "SKIP ${crate} (already on crates.io)"
            else
              echo "::error::Failed to publish ${crate} (exit ${code})"
              exit $code
            fi
            echo "::endgroup::"
          done
          echo "All library crates processed."
