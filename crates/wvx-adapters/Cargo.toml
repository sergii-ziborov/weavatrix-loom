[package]
name = "wvx-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "External pilot adapters for Weavatrix Loom JSON capabilities"
publish = true
keywords = ["weavatrix", "loom", "wvx"]
categories = ["development-tools"]
readme = "README.md"

[features]
default = ["host"]
# Host registration into wvx-component-sdk (playground). Disable for bare export vendor.
host = ["dep:wvx-component-sdk"]

[dependencies]
serde_json = { workspace = true }
# Third independent parse path for Gate A (not serde-based).
json = "0.12"
wvx-component-sdk = { workspace = true, optional = true }

[lints]
workspace = true
