# cargo-deny configuration for Weavatrix Loom
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "warn"
# Unmaintained is noise for intentional pilot backends; vulns still fail.
unmaintained = "workspace"
# Ignore only with explicit reason when needed.
ignore = [
    # Pilot multi-backend: `json` crate is an alternate parse impl (not default path).
    # Tracked as inventory-only / non-promoted; replace when Domain JSON backends shrink.
    { id = "RUSTSEC-2022-0081", reason = "intentional pilot alternate parse backend (json-crate.parse)" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "MIT-0",
    # webpki-roots (via reqwest/hyper-rustls → wvx-cortex)
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
